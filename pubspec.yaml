name: kericho_delivery
description: Delivery app for Kericho
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_launcher_icons: ^0.13.1

  # Essential Packages
  http: ^1.0.0
  provider: ^6.0.5
  flutter_dotenv: ^5.0.2

  # UI & Navigation
  google_fonts: ^8.0.0
  flutter_svg: ^1.1.6
  cached_network_image: ^3.2.3
  shimmer: ^2.0.0

  # Maps & Location
  google_maps_flutter: ^2.2.5
  geolocator: ^13.0.0
  geocoding: ^3.0.0

  # Forms & Validation
  flutter_form_builder: ^9.1.0

  # Notifications
  firebase_messaging: ^15.0.6

  # Storage
  shared_preferences: ^2.1.1
  hive: ^2.1.0
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.1.8
  connectivity_plus: ^6.0.2
  image_picker: ^0.8.6
  carousel_slider: ^5.1.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^1.1.0
  build_runner: ^2.3.3

flutter:
  assets:
    - assets/images/
    - assets/icons/
    - assets/svgs/
    - .env
    - assets/images/top-view-table-full-delicious-food-composition.jpg
    - assets/images/fresh-vegetables-fruit-market-stall.jpg
    - assets/images/portrait-young-african-guy-accepts-order-by-phone-motorbike-holding-boxes-with-pizza-sit-his-bike-urban-place.jpg
    - assets/images/fast_food.jpg
    - assets/images/a776e7d9-d788-4112-810a-dc0945c0071e.jpg
    - assets/images/tea.jpg
    - assets/images/green.jpg
    - assets/images/pharmacy.jpg
    - assets/images/meat.jpg
    - assets/images/fresh_mart.jpg

  fonts:
    - family: BrandonGrotesque
      fonts:
        - asset: assets/fonts/BrandonGrotesque-Light.otf
          weight: 300
        - asset: assets/fonts/BrandonGrotesque-Regular.otf
          weight: 400
        - asset: assets/fonts/BrandonGrotesque-Medium.otf
          weight: 500
        - asset: assets/fonts/BrandonGrotesque-Bold.otf
          weight: 700
        - asset: assets/fonts/BrandonGrotesque-Black.otf
          weight: 900
